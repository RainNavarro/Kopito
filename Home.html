<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KoPito — Coffee</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet" />

  <style>
    /* ===== DESIGN TOKENS ===== */
    :root {
      --espresso:   #1a0c04;
      --roast:      #2e1208;
      --mahogany:   #5c2710;
      --caramel:    #a0522d;
      --crema:      #e8d5b0;
      --foam:       #f5ede0;
      --gold:       #c9a84c;
      --gold-light: #e0c57a;
      --white:      #ffffff;
      --nav-bg:     rgba(20, 8, 2, 0.82);
      --nav-blur:   blur(24px);
      --radius-pill: 9999px;
      --radius-lg:   1.25rem;
      --transition:  cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-out:    cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ===== RESET ===== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'DM Sans', sans-serif;
      background: var(--espresso);
      color: var(--crema);
    }

    /* ===== GRAIN OVERLAY ===== */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 180px;
      opacity: 0.045;
      pointer-events: none;
      z-index: 9999;
    }

    /* ===== HERO BACKGROUND ===== */
    .hero-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .hero-bg__img {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 20%, rgba(90,40,10,0.55) 0%, transparent 70%),
        radial-gradient(ellipse 60% 80% at 80% 80%, rgba(30,10,2,0.8) 0%, transparent 70%),
        url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=1200&auto=format&fit=crop&q=80') center/cover no-repeat;
      animation: subtlePan 20s ease-in-out infinite alternate;
    }

    @keyframes subtlePan {
      0%   { background-position: center 40%; }
      100% { background-position: center 60%; }
    }

    .hero-bg__vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 120% 120% at 50% 50%, transparent 30%, rgba(10,3,1,0.7) 100%),
        linear-gradient(to bottom, rgba(10,3,1,0.5) 0%, transparent 25%, transparent 60%, rgba(10,3,1,0.9) 100%);
    }

    /* ===== STEAM PARTICLES ===== */
    .steam {
      position: fixed;
      bottom: 38%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1.2rem;
      z-index: 1;
      pointer-events: none;
    }

    .steam__line {
      width: 2px;
      height: 60px;
      background: linear-gradient(to top, rgba(255,255,255,0.18), transparent);
      border-radius: 2px;
      animation: steam-rise 3s ease-in-out infinite;
      transform-origin: bottom center;
    }

    .steam__line:nth-child(1) { animation-delay: 0s;    height: 45px; }
    .steam__line:nth-child(2) { animation-delay: 0.6s;  height: 65px; }
    .steam__line:nth-child(3) { animation-delay: 1.2s;  height: 50px; }

    @keyframes steam-rise {
      0%   { opacity: 0;    transform: translateY(0)    scaleX(1);   }
      30%  { opacity: 0.7; }
      100% { opacity: 0;    transform: translateY(-60px) scaleX(1.8); }
    }

    /* ===== LAYOUT WRAPPER ===== */
    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100dvh;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: 0 1.25rem;
    }

    /* ===== HERO CONTENT ===== */
    .hero-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 1rem;
      padding-top: 5rem;
      padding-bottom: 8rem;
    }

    /* Eyebrow label */
    .hero-eyebrow {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0;
      animation: fadeUp 0.8s var(--ease-out) 0.2s forwards;
    }

    .hero-eyebrow::before,
    .hero-eyebrow::after {
      content: '';
      display: block;
      width: 2rem;
      height: 1px;
      background: var(--gold);
      opacity: 0.6;
    }

    /* Brand name */
    .hero-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(5rem, 22vw, 9rem);
      font-weight: 300;
      line-height: 0.9;
      color: var(--foam);
      letter-spacing: -0.02em;
      opacity: 0;
      animation: fadeUp 1s var(--ease-out) 0.4s forwards;
    }

    .hero-title em {
      font-style: italic;
      color: var(--gold-light);
      font-weight: 400;
    }

    /* Tagline */
    .hero-tagline {
      font-family: 'DM Sans', sans-serif;
      font-size: clamp(0.875rem, 3.5vw, 1.1rem);
      font-weight: 300;
      color: rgba(232, 213, 176, 0.75);
      max-width: 28rem;
      line-height: 1.65;
      opacity: 0;
      animation: fadeUp 1s var(--ease-out) 0.6s forwards;
    }

    /* Info pills */
    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem;
      opacity: 0;
      animation: fadeUp 1s var(--ease-out) 0.8s forwards;
    }

    .meta-pill {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.35rem 0.9rem;
      border: 1px solid rgba(201, 168, 76, 0.3);
      border-radius: var(--radius-pill);
      background: rgba(201, 168, 76, 0.07);
      font-size: 0.78rem;
      color: var(--crema);
      text-decoration: none;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .meta-pill:hover {
      background: rgba(201, 168, 76, 0.15);
      border-color: rgba(201, 168, 76, 0.6);
    }

    .meta-pill svg {
      width: 13px;
      height: 13px;
      stroke: var(--gold);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* CTA Buttons */
    .hero-cta {
      display: flex;
      gap: 0.875rem;
      flex-wrap: wrap;
      justify-content: center;
      opacity: 0;
      animation: fadeUp 1s var(--ease-out) 1s forwards;
    }

    .btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.85rem 2rem;
      border-radius: var(--radius-pill);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      border: none;
      overflow: hidden;
      transition: transform 0.35s var(--transition), box-shadow 0.35s ease;
      letter-spacing: 0.02em;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.12);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .btn:hover::after { opacity: 1; }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0) scale(0.97); }

    .btn--primary {
      background: linear-gradient(135deg, var(--caramel) 0%, var(--mahogany) 100%);
      color: var(--foam);
      box-shadow: 0 4px 20px rgba(92, 39, 16, 0.55), inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .btn--primary:hover {
      box-shadow: 0 8px 32px rgba(92, 39, 16, 0.7), inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .btn--outline {
      background: rgba(255,255,255,0.05);
      color: var(--crema);
      border: 1px solid rgba(232, 213, 176, 0.3);
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .btn--outline:hover {
      border-color: rgba(201, 168, 76, 0.6);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Scroll hint */
    .scroll-hint {
      position: fixed;
      bottom: 8.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      opacity: 0;
      animation: fadeIn 1s ease 1.8s forwards;
      z-index: 2;
    }

    .scroll-hint span {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(232,213,176,0.45);
    }

    .scroll-hint__line {
      width: 1px;
      height: 2.5rem;
      background: linear-gradient(to bottom, rgba(201,168,76,0.5), transparent);
      animation: scrollPulse 2s ease-in-out infinite;
    }

    @keyframes scrollPulse {
      0%, 100% { opacity: 0.4; transform: scaleY(0.8); }
      50%       { opacity: 1;   transform: scaleY(1); }
    }

    /* ===== DYNAMIC ISLAND NAV ===== */
    .nav-island {
      position: fixed;
      bottom: 1.5rem;
      left: 1.5rem;
      transform: none;
      z-index: 10000;

      /* Island pill shape */
      background: var(--nav-bg);
      backdrop-filter: var(--nav-blur);
      -webkit-backdrop-filter: var(--nav-blur);
      border: 1px solid rgba(201, 168, 76, 0.18);
      border-radius: var(--radius-pill);
      box-shadow:
        0 8px 40px rgba(0,0,0,0.7),
        0 1px 0 rgba(201,168,76,0.08) inset,
        0 -1px 0 rgba(0,0,0,0.3) inset;

      /* Transition: liquid morph */
      transition:
        width 0.55s var(--transition),
        padding 0.4s var(--ease-out),
        border-radius 0.55s var(--transition),
        box-shadow 0.4s ease;

      /* Default: compact pill */
      width: min(340px, 90vw);
      padding: 0.45rem 0.6rem;
    }

    /* Expanded state (on tap/hover for desktop) */
    .nav-island:hover,
    .nav-island.expanded {
      width: min(420px, 92vw);
      box-shadow:
        0 16px 60px rgba(0,0,0,0.8),
        0 1px 0 rgba(201,168,76,0.15) inset,
        0 -1px 0 rgba(0,0,0,0.3) inset;
    }

    .nav-island__inner {
      display: flex;
      justify-content: space-around;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.2rem;
      min-width: 0;
    }

    .nav-item {
      display: flex;
      flex: 1 1 0;
      min-width: 0;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      padding: 0.45rem 0.65rem;
      border-radius: var(--radius-pill);
      text-decoration: none;
      color: rgba(232, 213, 176, 0.55);
      cursor: pointer;
      transition:
        color 0.3s ease,
        background 0.3s ease,
        transform 0.4s var(--transition);
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }

    .nav-item:hover,
    .nav-item.active {
      color: var(--foam);
      transform: translateY(-1px);
    }

    .nav-item.active {
      background: rgba(201, 168, 76, 0.12);
    }

    .nav-item__icon {
      position: relative;
      width: 22px;
      height: 22px;
    }

    .nav-item__icon svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.4s var(--transition);
    }

    .nav-item:hover .nav-item__icon svg,
    .nav-item.active .nav-item__icon svg {
      transform: scale(1.18);
    }

    /* Gold dot for active */
    .nav-item.active::after {
      content: '';
      position: absolute;
      bottom: 3px;
      left: 50%;
      transform: translateX(-50%);
      width: 3.5px;
      height: 3.5px;
      background: var(--gold);
      border-radius: 50%;
      animation: dotPop 0.4s var(--transition) forwards;
    }

    @keyframes dotPop {
      0%   { transform: translateX(-50%) scale(0); }
      100% { transform: translateX(-50%) scale(1); }
    }

    .nav-item__label {
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
      opacity: 0;
      max-width: 0;
      overflow: hidden;
      transition: opacity 0.3s ease, max-width 0.5s var(--ease-out);
    }

    /* Labels visible on wider nav or active item on desktop */
    @media (min-width: 480px) {
      .nav-item__label { opacity: 1; max-width: 60px; }
      .nav-island { padding: 0.5rem 0.75rem; }
    }

    /* Active item always shows label on mobile too */
    .nav-item.active .nav-item__label {
      opacity: 1;
      max-width: 60px;
      color: var(--gold-light);
    }

    /* Cart badge */
    .nav-item__badge {
      position: absolute;
      top: -2px;
      right: -4px;
      width: 14px;
      height: 14px;
      background: var(--gold);
      color: var(--espresso);
      border-radius: 50%;
      font-size: 0.55rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: badgePop 0.4s var(--transition) forwards;
      display: none; /* shown via JS */
    }

    /* Separator dot in island */
    .nav-sep {
      width: 1px;
      height: 20px;
      background: rgba(201,168,76,0.15);
      flex-shrink: 0;
    }

    .nav-toggle {
      display: none;
      align-items: center;
      justify-content: center;
      border: 0;
      background: transparent;
      color: var(--crema);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-toggle svg {
      width: 1.35rem;
      height: 1.35rem;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
    }

    @media (max-width: 639px) {
      .nav-island {
        left: auto;
        right: max(1rem, env(safe-area-inset-right));
        bottom: max(1rem, env(safe-area-inset-bottom));
        width: auto;
        padding: 0;
        border: 0;
        background: transparent;
        box-shadow: none;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }

      .nav-island:hover,
      .nav-island.expanded {
        width: auto;
        box-shadow: none;
      }

      .nav-toggle {
        display: flex;
        width: 3.25rem;
        height: 3.25rem;
        border-radius: 50%;
        background: var(--nav-bg);
        border: 1px solid rgba(201,168,76,0.22);
        color: var(--gold-light);
        box-shadow: 0 10px 36px rgba(0,0,0,0.62), 0 1px 0 rgba(201,168,76,0.12) inset;
        backdrop-filter: var(--nav-blur);
        -webkit-backdrop-filter: var(--nav-blur);
      }

      .nav-island__inner {
        position: absolute;
        right: 0;
        bottom: calc(100% + 0.75rem);
        width: min(14rem, calc(100vw - 2rem));
        padding: 0.6rem;
        flex-direction: column;
        align-items: stretch;
        flex-wrap: nowrap;
        gap: 0.25rem;
        background: var(--nav-bg);
        border: 1px solid rgba(201,168,76,0.2);
        border-radius: var(--radius-lg);
        box-shadow: 0 18px 55px rgba(0,0,0,0.72);
        backdrop-filter: var(--nav-blur);
        -webkit-backdrop-filter: var(--nav-blur);
        opacity: 0;
        pointer-events: none;
        transform: translateY(0.6rem) scale(0.96);
        transform-origin: bottom right;
        transition: opacity 0.25s ease, transform 0.3s var(--ease-out);
      }

      .nav-island.expanded .nav-island__inner {
        opacity: 1;
        pointer-events: auto;
        transform: none;
      }

      .nav-item {
        flex: none;
        flex-direction: row;
        justify-content: flex-start;
        gap: 0.7rem;
        padding: 0.72rem 0.85rem;
      }

      .nav-item__icon {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }

      .nav-item__label {
        opacity: 1;
        max-width: none;
        font-size: 0.72rem;
      }

      .nav-item.active::after {
        left: auto;
        right: 0.85rem;
        top: 50%;
        bottom: auto;
        transform: translateY(-50%);
        width: 5px;
        height: 5px;
        animation: none;
      }

      .nav-sep { display: none; }
    }

    /* ===== CORNER DETAILS ===== */
    .corner-badge {
      position: fixed;
      top: 1.8rem;
      right: 1.5rem;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.4rem 0.85rem;
      background: rgba(20, 8, 2, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(201, 168, 76, 0.2);
      border-radius: var(--radius-pill);
      font-size: 0.72rem;
      color: var(--gold-light);
      letter-spacing: 0.08em;
      font-weight: 500;
      opacity: 0;
      animation: fadeDown 0.8s var(--ease-out) 0.5s forwards;
    }

    .corner-badge__dot {
      width: 6px;
      height: 6px;
      background: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(74, 222, 128, 0.8);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.8); }
    }

    .brand-mark {
      position: fixed;
      top: 1.8rem;
      left: 1.5rem;
      z-index: 100;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 300;
      color: var(--foam);
      letter-spacing: 0.05em;
      opacity: 0;
      animation: fadeDown 0.8s var(--ease-out) 0.3s forwards;
    }

    .brand-mark em {
      font-style: italic;
      color: var(--gold);
    }

    /* ===== KEYFRAMES ===== */
    @keyframes fadeUp {
      0%   { opacity: 0; transform: translateY(24px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeDown {
      0%   { opacity: 0; transform: translateY(-12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      0%   { opacity: 0; }
      100% { opacity: 1; }
    }

    /* ===== DESKTOP REFINEMENTS ===== */
    @media (min-width: 768px) {
      .hero-title { font-size: clamp(7rem, 12vw, 10rem); }
      .hero-tagline { font-size: 1.1rem; }
      .btn { padding: 0.95rem 2.4rem; font-size: 0.95rem; }
      .steam { bottom: 35%; }

      .nav-island {
        bottom: 2rem;
      }
    }

    @media (min-width: 1024px) {
      .nav-item { padding: 0.6rem 1.1rem; }
    }

    /* ===== REDUCED MOTION ===== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>

  <!-- Background -->
  <div class="hero-bg" aria-hidden="true">
    <div class="hero-bg__img"></div>
    <div class="hero-bg__vignette"></div>
  </div>

  <!-- Steam effect -->
  <div class="steam" aria-hidden="true">
    <div class="steam__line"></div>
    <div class="steam__line"></div>
    <div class="steam__line"></div>
  </div>

  <!-- Top-left brand mark -->
  <div class="brand-mark">Ko<em>Pito</em></div>

  <!-- Top-right status badge -->
  <div class="corner-badge">
    <span class="corner-badge__dot"></span>
    Open Now
  </div>

  <!-- Main page -->
  <div class="page">

    <!-- Hero Content -->
    <main class="hero-content" role="main">

      <div class="hero-eyebrow">Artisan Coffee</div>

      <h1 class="hero-title">Ko<em>Pito</em></h1>

      <p class="hero-tagline">
        A quiet corner in Cavite where every cup is pulled with intention — rich, unhurried, yours.
      </p>

      <!-- Meta info pills -->
      <div class="hero-meta">
        <a class="meta-pill" href="https://www.google.com/maps/search/?api=1&query=KoPito%2014.2873922%2C121.001788" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
          Cavite, Philippines
        </a>
        <span class="meta-pill">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          7:00 AM – 10:00 PM Daily
        </span>
      </div>

      <!-- Call to action -->
      <div class="hero-cta">
        <a href="Menu.HTML" class="btn btn--primary">

  <script>
    // ── Dynamic Island: expand on interaction ──
    const island = document.querySelector('.nav-island');
    const navToggle = island.querySelector('.nav-toggle');
    let collapseTimer;

    function setNavExpanded(expanded) {
      island.classList.toggle('expanded', expanded);
      navToggle.setAttribute('aria-expanded', String(expanded));
    }

    island.addEventListener('mouseenter', () => {
      clearTimeout(collapseTimer);
      setNavExpanded(true);
    });

    island.addEventListener('mouseleave', () => {
      collapseTimer = setTimeout(() => setNavExpanded(false), 600);
    });

    // Touch: tap to expand briefly
    island.addEventListener('touchstart', () => {
      clearTimeout(collapseTimer);
      setNavExpanded(true);
      collapseTimer = setTimeout(() => setNavExpanded(false), 3000);
    }, { passive: true });

    navToggle.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
    navToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      clearTimeout(collapseTimer);
      setNavExpanded(!island.classList.contains('expanded'));
    });

    document.addEventListener('click', (e) => {
      if (window.matchMedia('(max-width: 639px)').matches && !island.contains(e.target)) setNavExpanded(false);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') setNavExpanded(false);
    });

    // ── Liquid nav item click ──
    const navItems = document.querySelectorAll('.nav-item');
    navItems.forEach(item => {
      item.addEventListener('click', (e) => {
        navItems.forEach(n => n.classList.remove('active'));
        item.classList.add('active');

        // Ripple feel: quick scale bounce
        item.style.transform = 'scale(0.9) translateY(0)';
        setTimeout(() => {
          item.style.transform = '';
        }, 180);
      });
    });

    // ── Keyboard: mark active on focus ──
    navItems.forEach(item => {
      item.addEventListener('focus', () => {
        navItems.forEach(n => n.classList.remove('active'));
        item.classList.add('active');
      });
    });

    // ── Parallax tilt on hero (desktop only) ──
    if (window.matchMedia('(hover: hover)').matches) {
      document.addEventListener('mousemove', (e) => {
        const xRatio = (e.clientX / window.innerWidth  - 0.5) * 2;
        const yRatio = (e.clientY / window.innerHeight - 0.5) * 2;
        const img = document.querySelector('.hero-bg__img');
        if (img) {
          img.style.transform = `translate(${xRatio * -8}px, ${yRatio * -6}px) scale(1.03)`;
        }
      });
    }
  </script>
